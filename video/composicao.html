<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#0a0f1c;font-family:Inter,Arial,sans-serif;color:#fff}
#s{position:absolute;inset:0}.l{position:absolute;opacity:0}
.tag{top:180px;left:80px;background:#e11d2e;padding:14px 28px;font-weight:800;font-size:44px;letter-spacing:4px}
.h{left:80px;right:80px;font-weight:900;line-height:1.02}
.cap{bottom:260px;left:70px;right:70px;text-align:center;font-size:54px;font-weight:800;background:rgba(0,0,0,.65);padding:24px 30px;border-radius:18px}
.big{font-size:360px;font-weight:900;color:#e11d2e;left:80px;top:560px}
.grid{inset:0;background-image:linear-gradient(#1b2740 2px,transparent 2px),linear-gradient(90deg,#1b2740 2px,transparent 2px);background-size:90px 90px;opacity:.5}
.bar{left:0;top:0;height:12px;background:#e11d2e}
</style></head><body><div id="s">
<div class="l grid" id="grid"></div>
<svg class="l" id="map" width="1080" height="1920" viewBox="0 0 1080 1920"><path d="M520 300 L700 300 L760 520 L820 760 L860 1000 L830 1180 L760 1260 L700 1150 L640 900 L560 700 L470 560 L300 520 L300 300 Z" fill="none" stroke="#3b82f6" stroke-width="6"/><circle cx="820" cy="1100" r="18" fill="#e11d2e"/><circle id="pulse" cx="820" cy="1100" r="18" fill="none" stroke="#e11d2e" stroke-width="6"/></svg>
<svg class="l" id="plane" width="220" height="220" viewBox="0 0 24 24"><path fill="#fff" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
<div class="l tag" id="tag">URGENTE</div>
<div class="l h" id="h1" style="top:300px;font-size:120px">AVIÃO CAI NA FLÓRIDA</div>
<div class="l h" id="h2" style="top:470px;font-size:60px;color:#93c5fd">Boca Raton · perto da I-95</div>
<div class="l big" id="n3">3</div>
<div class="l h" id="h3" style="top:960px;font-size:80px">MORTOS<br><span style="color:#93c5fd;font-size:60px">+1 motorista ferido</span></div>
<div class="l h" id="h4" style="top:760px;font-size:96px">FAA e NTSB<br>investigam</div>
<div class="l cap" id="cap"></div>
<div class="l bar" id="bar"></div></div>
<script>
const caps=[[0,2.6,"Boca Raton, Flórida."],[2.6,5.2,"Um avião de pequeno porte caiu perto da rodovia I-95."],[5.2,7.8,"Três pessoas morreram e um motorista ficou ferido."],[7.8,10,"FAA e NTSB investigam a causa."]];
const E=t=>1-Math.pow(1-Math.min(Math.max(t,0),1),3);
const $=i=>document.getElementById(i);
function seg(el,a,b,t,f){const on=t>=a&&t<b;el.style.opacity=on?Math.min(E((t-a)/.4),E((b-t)/.3)):0;if(on&&f)f((t-a)/(b-a),E((t-a)/.5))}
window.render=t=>{
 $('grid').style.opacity=.5;$('grid').style.transform=`translateY(${-t*20}px)`;
 seg($('map'),0,5.2,t,(p,e)=>{$('map').style.transform=`scale(${1+p*.15})`;$('pulse').setAttribute('r',18+(t*60%60));$('pulse').style.opacity=1-(t*60%60)/60});
 seg($('plane'),2.6,5.2,t,p=>{const x=1100-p*800,y=200+p*p*1200;$('plane').style.transform=`translate(${x}px,${y}px) rotate(${-90-p*60}deg)`});
 seg($('tag'),0,10,t,(p,e)=>$('tag').style.transform=`translateX(${(1-e)*-300}px)`);
 seg($('h1'),.2,5.2,t,(p,e)=>$('h1').style.transform=`translateY(${(1-e)*80}px)`);
 seg($('h2'),.6,5.2,t,(p,e)=>$('h2').style.transform=`translateY(${(1-e)*60}px)`);
 seg($('n3'),5.2,7.8,t,(p,e)=>$('n3').style.transform=`scale(${.4+e*.6})`);
 seg($('h3'),5.4,7.8,t,(p,e)=>$('h3').style.transform=`translateX(${(1-e)*200}px)`);
 seg($('h4'),7.8,10.1,t,(p,e)=>$('h4').style.transform=`scale(${.8+e*.2})`);
 const c=caps.find(c=>t>=c[0]&&t<c[1])||caps[3];$('cap').textContent=c[2];$('cap').style.opacity=1;
 $('bar').style.opacity=1;$('bar').style.width=(t/10*1080)+'px';
 document.body.style.background=(t>5.2&&t<5.4)?'#3a0a10':'#0a0f1c';}
render(0);
</script></body></html>
